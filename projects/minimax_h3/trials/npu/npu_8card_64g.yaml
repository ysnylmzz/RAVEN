# 8-card inference on 64 GiB cards (Ascend 910B). Not yet run on 910B.
#
# The DiT (~66 GB in bf16) does not fit a 64 GiB card whole, so it stays
# FSDP2-sharded across the 8 cards, as in the base trial, but with one Ulysses
# SP group of 8 and without CPU offload. The LoRA adapter runs unmerged in
# fp32: the bf16 cast plugin needs whole weights.
#
# The same placement on an Ascend 950 (npu_bench_rtf_8card_950_fsdp.yaml)
# measured RTF 7.8, 62 s per 8 s clip, at a 33.9 GiB peak per card. Every
# forward all-gathers the DiT, so that time is set by the cards' interconnect
# and will differ on 910B.
#
#   ASCEND_RT_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 HCCL_NPU_SOCKET_PORT_RANGE=auto \
#   N=8 bash tools/multi_run.sh projects/minimax_h3/trials/npu/npu_8card_64g.yaml
__inherit__: projects/minimax_h3/trials/base/causal_minimax_h3_base/minimax_h3_raven_streaming_lora_4nfe_preview.yaml

distributed:
  up_size: [8]

engine:
  up_size:
    train: 8
    validation: 8

models:
  backbone:
    placement:
      fsdp:
        cpu_offload: false
  text_encoder:
    placement:
      fsdp:
        cpu_offload: false
