# RTF benchmark of the production build on 8x Ascend 950 (128 GiB per card).
#
# npu_8card_950.yaml -- 768x1376, 192 frames, one Ulysses SP group across all
# 8 cards, DiT replicated with the LoRA merged in, video decode split across
# the group -- with the engine swapped for the RTF benchmark, so a clip's wall
# clock splits into encode / rollout / decode, warm vs cold, plus a per-chunk
# profile.
#
#   ASCEND_RT_VISIBLE_DEVICES=0,1,2,3,4,5,6,7 HCCL_NPU_SOCKET_PORT_RANGE=auto \
#   N=8 bash tools/multi_run.sh projects/minimax_h3/trials/npu/npu_bench_rtf_8card_950.yaml
#
# One-variable A/B runs against this baseline (change exactly one per run):
#
#   attention   RAVEN_NPU_FUSED_ATTN=0 in the environment -> the old SDPA fallback
#   LoRA        append: models.backbone.placement.plugins.0.enabled false
#   decode      append: validation.decode_parallel false (one card per SP group)
#   FSDP        npu_bench_rtf_8card_950_fsdp.yaml (DiT sharded, adapter unmerged)
#   SP 4        npu_bench_rtf_8card_950_sp4.yaml (two SP groups of 4 cards)
#   op profile  append: benchmark.profile true
#
# With two SP groups, every run so far got slower iteration by iteration (up to
# ~45% by the fourth); one group of 8 stayed flat. Compare runs on the same
# iteration index, not only on the mean.
__inherit__: npu_8card_950.yaml

entry:
  module: projects.minimax_h3.tools.benchmark_rtf
  class_name: RTFBenchmarkEngine

validation:
  num_prompts: 1

benchmark:
  # The first pass pays CANN op compilation and allocator growth; discard it.
  warmup: 1
  iters: 4
  decode: true
  per_chunk: true
  profile: false
  # Chunk 5 is past sink (2) + window (2), so its KV cache is at full length.
  profile_chunk: 5
  profile_ranks: [0]
