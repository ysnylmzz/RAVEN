# RTF benchmark on an Ascend 950 (128 GiB HBM per card), single rank.
#
# Same model build as step 4a on the 950 -- DiT straight on the card with no
# FSDP, text encoder on a 1-rank mesh for CPU offload -- but the engine times
# the inference phases instead of writing mp4s.
#
# Keeps 4a's halved spatial size (384x672) so the number is comparable to the
# 4a bring-up run. For the production figure, override to the real resolution:
#   ... npu_bench_rtf_950.yaml validation.height 768 validation.width 1376
#
#   ASCEND_RT_VISIBLE_DEVICES=0 N=1 bash tools/multi_run.sh projects/minimax_h3/trials/npu/npu_bench_rtf_950.yaml
__inherit__: npu_4a_single_card_950.yaml

entry:
  module: projects.minimax_h3.tools.benchmark_rtf
  class_name: RTFBenchmarkEngine

benchmark:
  # The first pass pays CANN op compilation and allocator growth; discard it.
  warmup: 1
  iters: 3
  decode: true
  per_chunk: true
